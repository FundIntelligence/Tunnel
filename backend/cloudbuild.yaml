steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/parity-backend', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/parity-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - parity-backend
      - --image=gcr.io/$PROJECT_ID/parity-backend
      - --region=us-central1
      - --platform=managed
      - --memory=12Gi
      - --cpu=4
      - --allow-unauthenticated
      - --timeout=1200
      - --concurrency=80
      - --min-instances=0
      - --max-instances=3
