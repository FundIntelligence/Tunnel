# TEMPORARY (PAR-216 follow-up, 2026-08-31): --timeout bumped 600 -> 900 to
# unblock a large (451-page) Equity statement's ~159s local processing time
# on production's more constrained resources. This is NOT a fix for PAR-216
# (the real fix is eliminating the double-parse the ticket documents) --
# revisit reverting this once that fix ships, since a fixed ingestion path
# may not need the extra headroom at all.
#
# ⚠️ UNCONFIRMED: unlike backend/ (which has separate parity-backend /
# parity-backend-prod services and cloudbuild-staging.yaml / cloudbuild-
# prod.yaml files), this is the ONLY cloudbuild.yaml for parity-ingestion,
# deploying to a single service literally named "parity-ingestion" with no
# -staging/-prod split found anywhere in this repo or in PAR-86. Before
# merging or deploying this: confirm whether parity-ingestion is in fact a
# single shared service between staging and prod backends. If it is, this
# change cannot be scoped to "staging only" as intended without first
# splitting the service/deploy path -- deploying this as-is could affect
# prod, which was explicitly out of scope for this change.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/parity-ingestion', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/parity-ingestion']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - parity-ingestion
      - --image=gcr.io/$PROJECT_ID/parity-ingestion
      - --region=us-central1
      - --platform=managed
      - --memory=2Gi
      - --cpu=2
      - --allow-unauthenticated
      - --timeout=900
      - --concurrency=10
      - --min-instances=0
      - --max-instances=3
